<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Character Checker</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<body>

<div class="header">
    <h1>キャラ所持チェッカー</h1>
    <button id="export-btn">PNG出力</button>
    <button id="export-json-btn">
    JSON出力
</button>

<input
    type="file"
    id="import-json"
    accept=".json">
</div>

<div class="filter-bar">

    <input
        type="text"
        id="search-box"
        placeholder="キャラ名検索">

    <select id="nation-filter">
        <option value="all">全陣営</option>
        <option value="神霄帝国">神霄帝国</option>
        <option value="イズモ">イズモの国</option>
        <option value="ミスト">ミスト王国</option>
        <option value="エレン">エレン連邦</option>
        <option value="聖教会">聖教会</option>
        <option value="ウトピア">ウトピア</option>
        <option value="中立">中立</option>
    </select>

</div>

<div id="character-grid"></div>

<div id="png-layout" style="display:none;"></div>

<script src="app.js?v=3"></script>

</body>
</html>
