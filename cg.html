<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CGチェッカー</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<body>



<div id="side-menu" class="side-menu">

        <button id="close-menu">
        ×
    </button>

    <div class="menu-user-area">

    <div class="menu-user">
        UserName
    </div>

    <button id="change-name-btn">
        名前変更
    </button>

</div>

    <a href="index.html">
        キャラチェッカー
    </a>

    <a href="equipment.html">
        装備チェッカー
    </a>

    <a href="cg.html">
        CGチェッカー
    </a>

    <button id="history-btn">
        更新履歴
    </button>

</div>

<div id="history-modal" class="history-modal">

    <div class="history-content">

        <div class="history-body">
        </div>

        <button id="close-history">
            閉じる
        </button>

    </div>

</div>

<div id="menu-overlay"></div>


<div class="header">
    <button id="menu-btn" class="menu-btn">
☰
</button>
<h1>CGチェッカー</h1>

<div class="nav-buttons">
<label class="png-option">
    <input
        type="checkbox"
        id="hide-complete-cg"
    >
    完了CGを除外
</label>

<button id="export-btn">
    PNG出力
</button>

<button id="reset-btn">
    リセット
</button>

<button id="export-json-btn">
    JSON出力
</button>

<input
    type="file"
    id="import-json"
    accept=".json"
    style="display:none"
>

<button id="import-json-btn">
    JSON読込
</button>
</div>

</div>

<div class="filter-bar">

    <input
        type="text"
        id="search-box"
        placeholder="キャラ名検索">

    <select id="nation-filter">
        <option value="all">全陣営</option>
        <option value="神霄帝国">神霄帝国</option>
        <option value="イズモ">イズモの国</option>
        <option value="ミスト">ミスト王国</option>
        <option value="エレン">エレン連邦</option>
        <option value="聖教会">聖教会</option>
        <option value="ウトピア">ウトピア</option>
        <option value="中立">中立</option>
    </select>

</div>

<div id="character-grid"></div>

<script src="history.js?v=4"></script>
<script src="cg.js?v=4"></script>

</body>
</html>
</html>
